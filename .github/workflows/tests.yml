name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ASAN both with the production allocator and with per-allocation redzones
  linux-clang-asan:
    name: linux-clang-asan (slab=${{ matrix.slab }} lean=${{ matrix.lean }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - slab: "ON"
            disable_slab: "OFF"
            lean: "OFF"
            no_file_io: "OFF"
            no_std_format: "OFF"
            assertions: "auto"
          - slab: "OFF"
            disable_slab: "ON"
            lean: "ON"
            no_file_io: "ON"
            no_std_format: "ON"
            assertions: "off"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install latest CMake + Ninja
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

      - name: Install Clang 22
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22
          clang++-22 --version

      - name: Configure
        env:
          CC: clang-22
          CXX: clang++-22
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFDF_ENABLE_ASAN=ON
          -DFDF_DISABLE_SLAB_ALLOCATOR=${{ matrix.disable_slab }}
          -DFDF_NO_FILE_IO=${{ matrix.no_file_io }}
          -DFDF_NO_STD_FORMAT=${{ matrix.no_std_format }}
          -DFDF_ASSERTIONS=${{ matrix.assertions }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # Short libFuzzer runs complement the corpus replays in other jobs
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ["parse", "roundtrip", "combine"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install latest CMake + Ninja
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

      - name: Install Clang 22
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22
          clang++-22 --version

      - name: Configure
        env:
          CC: clang-22
          CXX: clang++-22
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DFDF_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build --target fuzz_${{ matrix.target }}

      # libFuzzer writes new inputs into the first corpus directory, so that one is a scratch dir
      # and the checked-in seeds follow it as read-only inputs
      - name: Fuzz
        run: |
          mkdir -p "${RUNNER_TEMP}/corpus" "${RUNNER_TEMP}/artifacts"
          ./build/fuzz/fuzz_${{ matrix.target }} \
            -max_total_time=120 -timeout=25 -rss_limit_mb=2048 \
            -print_final_stats=1 \
            -artifact_prefix="${RUNNER_TEMP}/artifacts/" \
            "${RUNNER_TEMP}/corpus" fuzz/corpus

      # the crash log names the reproducer but does not contain it, so keep the bytes
      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-reproducers
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: ignore

  # Linux / GCC
  linux-gcc:
    name: linux-gcc (mod=${{ matrix.modules }} noCmt=${{ matrix.no_comments }} ext=${{ matrix.extended }})
    runs-on: ubuntu-24.04
    container: gcc:latest
    strategy:
      fail-fast: false
      matrix:
        modules: ["OFF", "ON"]
        no_comments: ["OFF", "ON"]
        extended: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install CMake + Ninja
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          gcc --version

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFDF_USE_CPP_MODULES=${{ matrix.modules }}
          -DFDF_NO_COMMENTS=${{ matrix.no_comments }}
          -DFDF_EXTENDED_NO_COMMENT_IDENTIFIERS=${{ matrix.extended }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Linux / Clang
  linux-clang:
    name: linux-clang (mod=${{ matrix.modules }} noCmt=${{ matrix.no_comments }} ext=${{ matrix.extended }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modules: ["OFF", "ON"]
        no_comments: ["OFF", "ON"]
        extended: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install latest CMake + Ninja
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

      - name: Install Clang 22
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-tools-22
          clang++-22 --version

      - name: Configure
        env:
          CC: clang-22
          CXX: clang++-22
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=$(command -v clang-scan-deps-22)
          -DFDF_USE_CPP_MODULES=${{ matrix.modules }}
          -DFDF_NO_COMMENTS=${{ matrix.no_comments }}
          -DFDF_EXTENDED_NO_COMMENT_IDENTIFIERS=${{ matrix.extended }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows / MSVC
  windows-msvc:
    name: windows-msvc (mod=${{ matrix.modules }} noCmt=${{ matrix.no_comments }} ext=${{ matrix.extended }})
    runs-on: windows-2025
    # MSVC module builds currently ICE, so they are allowed to fail for now
    continue-on-error: ${{ matrix.modules == 'ON' }}
    strategy:
      fail-fast: false
      matrix:
        modules: ["OFF", "ON"]
        no_comments: ["OFF", "ON"]
        extended: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install latest CMake + Ninja
        uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFDF_USE_CPP_MODULES=${{ matrix.modules }}
          -DFDF_NO_COMMENTS=${{ matrix.no_comments }}
          -DFDF_EXTENDED_NO_COMMENT_IDENTIFIERS=${{ matrix.extended }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows / GCC (MSYS2 UCRT64)
  windows-gcc:
    name: windows-gcc (mod=${{ matrix.modules }} noCmt=${{ matrix.no_comments }} ext=${{ matrix.extended }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        modules: ["OFF", "ON"]
        no_comments: ["OFF", "ON"]
        extended: ["OFF", "ON"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFDF_USE_CPP_MODULES=${{ matrix.modules }}
          -DFDF_NO_COMMENTS=${{ matrix.no_comments }}
          -DFDF_EXTENDED_NO_COMMENT_IDENTIFIERS=${{ matrix.extended }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Windows / Clang (MSYS2 CLANG64)
  windows-clang:
    name: windows-clang (mod=${{ matrix.modules }} noCmt=${{ matrix.no_comments }} ext=${{ matrix.extended }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        modules: ["OFF", "ON"]
        no_comments: ["OFF", "ON"]
        extended: ["OFF", "ON"]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup MSYS2 (CLANG64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFDF_USE_CPP_MODULES=${{ matrix.modules }}
          -DFDF_NO_COMMENTS=${{ matrix.no_comments }}
          -DFDF_EXTENDED_NO_COMMENT_IDENTIFIERS=${{ matrix.extended }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  editors:
    name: editor packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read the declared version
        id: version
        run: sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/version=\1/p' editors/package.json | head -1 >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 editors/package.py --version "$VERSION" --out staging
          cp LICENSE editors/LICENSE
          (cd editors && npx --yes @vscode/vsce@3.9.2 package --out "../staging/fdf-$VERSION.vsix")
          rm editors/LICENSE

      - name: Verify packages
        run: python3 editors/verify.py staging "${{ steps.version.outputs.version }}"
